<!doctype html>

    <title>About Me From</title>

  <body>
    <form>
      <label for="text">Name:</label>
      <input type="text" placeholder="Name.." />
      <br /><br />
      <label for="email">Email:</label>
      <input type="email" placeholder="Email.." />
      <br /><br />
      <label for="password">Password:</label>
      <input type="password" placeholder="Password.." />
      <br /><br />
      <label for="date">Date of Birth:</label>
      <input type="date" />
      <br /><br />
      <label for="number">Age:</label>
      <input type="number" placeholder="Age.." />
      <br /><br />
      <label for="phone">Phone Number:</label>
      <input type="number" placeholder="Phone Number.." />
      <br /><br />
      <label for="select">Select Your Profession:</label>
      <select name="profession" id="profession">
        <option value="Student">Student</option>
        <option value="Teacher">Teacher</option>
        <option value="Engineer">Engineer</option>
        <option value="Doctor">Doctor</option>
        <option value="Others">Others</option>
      </select>
      <br /><br />
      <label for="location">Location:</label>
      <select name="location" id="location">
        <option value="Dhaka">Dhaka</option>
        <option value="Dinajpur">Dinajpur</option>
        <option value="Others">others</option>
      </select>
      <br /><br />
      <label for="zip">Zip Code:</label>
      <input type="number" placeholder="Zip Code.." />
      <br /><br />
      <label for="radio">Gender:</label>
      <input type="radio" name="gender" value="Male" />Male
      <input type="radio" name="gender" value="Female" />Female <br /><br />
      <label for="checkbox">Skills:</label>
      <input type="checkbox" name="service" value="HTML" />HTML
      <input type="checkbox" name="service" value="CSS" />CSS <br /><br />
      <label for="file">Upload Your Image:</label>
      <input type="file" />
      <br /><br />
      <label for="comments">Comments:</label>
      <textarea
        name="comments"
        rows="5"
        cols="30"
        placeholder="Write your comments here..."
      ></textarea>
      <br /><br />
      <input type="submit" value="Submit Data" />
      <input type="reset" value="Reset All" />
    </form>
